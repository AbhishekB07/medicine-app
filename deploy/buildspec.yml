
version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: ap-southeast-2
    AWS_ACCOUNT_ID: "931814980230"
    IMAGE_REPO_NAME: "sapient_task/api"
    CONTAINER_NAME: "Main"

phases:
  
  pre_build:
    commands:
      - echo "Checking AWS identity..."
      - aws sts get-caller-identity
      - echo "Checking ECR repository..."
      - aws ecr describe-repositories --repository-names sapient_task/api --region ap-southeast-2
      - echo "Generating ECR authentication token..."
      - aws ecr get-login-password --region ap-southeast-2 > /tmp/ecr-password
      - test -s /tmp/ecr-password
      - echo "Logging in to ECR..."
      - docker login --username AWS --password-stdin 931814980230.dkr.ecr.ap-southeast-2.amazonaws.com < /tmp/ecr-password
      - echo "Preparing image tag..."
      - REPOSITORY_URI=931814980230.dkr.ecr.ap-southeast-2.amazonaws.com/sapient_task/api
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:=latest}


  build:
    commands:
      - echo "Restoring and testing .NET solution..."
      - docker run --rm -v "$CODEBUILD_SRC_DIR:/src" -w /src mcr.microsoft.com/dotnet/sdk:10.0 dotnet restore MedicineApp.slnx
      - docker run --rm -v "$CODEBUILD_SRC_DIR:/src" -w /src mcr.microsoft.com/dotnet/sdk:10.0 dotnet test MedicineApp.slnx --no-restore --configuration Release
      - echo "Building AMD64 Docker image..."
      - docker build --platform linux/amd64 -f deploy/Dockerfile -t $REPOSITORY_URI:$IMAGE_TAG .

  post_build:
    commands:
      - echo "Pushing image to ECR..."
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - docker tag $REPOSITORY_URI:$IMAGE_TAG $REPOSITORY_URI:latest
      - docker push $REPOSITORY_URI:latest
      - echo "Generating imagedefinitions.json..."
      - printf '[{"name":"%s","imageUri":"%s"}]' "$CONTAINER_NAME" "$REPOSITORY_URI:$IMAGE_TAG" > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
