
version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: ap-southeast-2
    AWS_ACCOUNT_ID: "931814980230"
    IMAGE_REPO_NAME: "sapient_task/api"
    CONTAINER_NAME: "Main"

phases:
  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."
      - REPOSITORY_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME
      - aws sts get-caller-identity
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION > /tmp/ecr-password
      - cat /tmp/ecr-password | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:=latest}

  build:
    commands:
      - echo "Restoring and testing .NET solution..."
      - docker run --rm -v "$CODEBUILD_SRC_DIR:/src" -w /src mcr.microsoft.com/dotnet/sdk:10.0 dotnet restore SapientTask.sln
      - docker run --rm -v "$CODEBUILD_SRC_DIR:/src" -w /src mcr.microsoft.com/dotnet/sdk:10.0 dotnet test SapientTask.sln --no-restore --configuration Release
      - echo "Building AMD64 Docker image..."
      - docker build --platform linux/amd64 -f deploy/Dockerfile -t $REPOSITORY_URI:$IMAGE_TAG .

  post_build:
    commands:
      - echo "Pushing image to ECR..."
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - docker tag $REPOSITORY_URI:$IMAGE_TAG $REPOSITORY_URI:latest
      - docker push $REPOSITORY_URI:latest
      - echo "Generating imagedefinitions.json..."
      - printf '[{"name":"%s","imageUri":"%s"}]' "$CONTAINER_NAME" "$REPOSITORY_URI:$IMAGE_TAG" > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
