
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sapient-task-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sapient-task-api
  template:
    metadata:
      labels:
        app: sapient-task-api
    spec:
      containers:
        - name: sapient-task-api
          image: 931814980230.dkr.ecr.ap-southeast-2.amazonaws.com/sapient_task/api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
